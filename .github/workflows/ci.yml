name: Tests

on: [pull_request]

jobs:

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    env:
      MOCKSERVER_URL: 'http://localhost:1080'
    services:
      mockserver:
        image: mockserver/mockserver:9.2.0
        ports:
          - "1080:1080"
        env:
          MOCKSERVER_INITIALIZATION_JSON_PATH: /docker/mockserver/expectations/**.json
          MOCKSERVER_LOG_LEVEL: WARN
    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - "lowest"
          - "highest"
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          tools: "composer:v2"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: "Install lowest dependencies"
        if: ${{ matrix.dependencies == 'lowest' }}
        run: composer update --prefer-lowest --no-interaction --no-progress

      - name: "Install highest dependencies"
        if: ${{ matrix.dependencies == 'highest' }}
        run: composer update --no-interaction --no-progress

      - name: "Run unit tests"
        run: ./vendor/bin/phpunit -c phpunit.xml

  cs:
    name: Codestyle check on PHP 8.2
    runs-on: ubuntu-latest
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.2'

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader --prefer-stable

      - name: Run tests
        run: ./vendor/bin/phpcs

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - '8.2'
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader --prefer-stable

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit 512M
